[package]
name = "probe_core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Tiny Rust->wasm32-unknown-unknown probe for the Zotero runtime harness (hand-written ABI, no wasm-bindgen)"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
