[package]
name = "probe_wbg"
version = "0.1.0"
edition = "2021"
publish = false
description = "wasm-bindgen variant of the Zotero runtime probe core (tests generated JS glue inside Zotero)"

[lib]
crate-type = ["cdylib"]

[dependencies]
# must match the installed wasm-bindgen CLI exactly
wasm-bindgen = "=0.2.126"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
