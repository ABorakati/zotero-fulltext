[package]
name = "fulltext-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The only crate with exported symbols: the hand-written zero-import wasm ABI over fulltext-core and fulltext-engine."

# cdylib ONLY: a crate that is both rlib and cdylib silently drops LTO (+16 % size, research/07 section 1.3).
[lib]
crate-type = ["cdylib"]

[dependencies]
fulltext-core.workspace = true
fulltext-engine.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[features]
# Trap-recovery test build ONLY (`cargo xtask build --debug-panic`): adds the `fx_debug_panic` export so the Node
# tests can make the instance panic, run out of memory and recover. Off by default; never enabled for the plugin.
debug-panic = []
