<!-- Shape of the "SSO Login Service - Loading Session Information" page that a Shibboleth IdP v4/v5 serves first at
     /idp/profile/SAML2/Redirect/SSO?execution=e1s1 (captured 2026-10-21 by an unauthenticated GET through a
     publisher WAYFless link; the institution's name and the per-request csrf token and nonce are replaced). A
     JavaScript form submit (no SAMLRequest field) carries the browser's local-storage session to the IdP. -->

<!DOCTYPE html>
<html>
    <head>
        <title>SSO Login Service - Loading Session Information</title>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
        <link rel="stylesheet" type="text/css" href="/idp/css/placeholder.css">
        <script nonce="_nonce"><!-- "use strict";
function readLocalStorage(key) {
    var success;
    try {
        var value = localStorage.getItem(key);
        if (value != null) {
            document.form1["shib_idp_ls_value." + key].value = value;
        }
        success = "true";
    } catch (e) {
        success = "false";
        document.form1["shib_idp_ls_exception." + key].value = e;
    }
    document.form1["shib_idp_ls_success." + key].value = success;
}

function isLocalStorageSupported() {
    try {
        localStorage.setItem("shib_idp_ls_test", "shib_idp_ls_test");
        localStorage.removeItem("shib_idp_ls_test");
        return true;
    } catch (e) {
        return false;
    }
}
 // --></script>
    </head>
    <body onload="doLoad()">
        <main class="main">
            <section>
                <h1>SSO Login Service - Loading Session Information</h1>
                <p>Loading login session information from the browser...</p>
                <noscript>
                    Since your browser does not support JavaScript, you must press the Continue button once to proceed.
                </noscript>
<form name="form1" action="/idp/profile/SAML2/Redirect/SSO?execution=e1s1" method="post">
    <input type="hidden" name="csrf_token" value="_csrf" />
        <input name="shib_idp_ls_exception.shib_idp_session_ss" type="hidden" />
        <input name="shib_idp_ls_success.shib_idp_session_ss" type="hidden" value="false" />
        <input name="shib_idp_ls_value.shib_idp_session_ss" type="hidden" />
        <input name="shib_idp_ls_exception.shib_idp_persistent_ss" type="hidden" />
        <input name="shib_idp_ls_success.shib_idp_persistent_ss" type="hidden" value="false" />
        <input name="shib_idp_ls_value.shib_idp_persistent_ss" type="hidden" />
    <input name="shib_idp_ls_supported" type="hidden" />
    <input name="_eventId_proceed" type="hidden" />
    <noscript>
        <input type="submit" value="Continue" />
    </noscript>
</form>

<script nonce="_nonce">
<!--
function doLoad() {
    var localStorageSupported = isLocalStorageSupported();
    document.form1["shib_idp_ls_supported"].value = localStorageSupported;
    if (localStorageSupported) {
        readLocalStorage("shib_idp_session_ss");
        readLocalStorage("shib_idp_persistent_ss");
    }
    document.form1.submit();
}
// -->
</script>
            </section>
        </main>
        <footer class="footer">
            <div class="cc">
                <p>University of Example</p>
            </div>
        </footer>
    </body>
</html>
