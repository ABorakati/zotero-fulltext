<?xml version="1.0"?>
<!-- zotero-fulltext batch progress window (owner: js-ui). One window per run; closing it does not cancel the run.
     Rows are rendered by progress-window.js from ZFT.progress.ProgressModel; text comes from Fluent
     (zotero-fulltext.ftl) via document.l10n.setAttributes. The title is set from the script. -->
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml"
        id="zft-progress-window"
        windowtype="zotero-fulltext:progress"
        width="640" height="480"
        style="min-width: 480px; min-height: 280px;">
  <linkset>
    <html:link rel="localization" href="zotero-fulltext.ftl"/>
  </linkset>
  <script src="chrome://zotero-fulltext/content/progress-window.js"/>
  <vbox flex="1">
    <html:div id="zft-progress-header" role="status" style="padding:8px 12px;border-bottom:1px solid #888;font:13px system-ui,sans-serif;"></html:div>
    <html:div id="zft-progress-rows" role="list" style="flex:1;min-height:0;overflow:auto;padding:4px 12px;font:13px system-ui,sans-serif;"></html:div>
    <html:div id="zft-progress-ledger" hidden="true" style="padding:6px 12px;border-top:1px solid #888;font:12px system-ui,sans-serif;opacity:0.8;"></html:div>
    <hbox id="zft-progress-footer" style="padding:8px 12px;border-top:1px solid #888;" pack="end">
      <html:button id="zft-progress-copy" data-l10n-id="zotero-fulltext-report-copy-diagnostics" hidden="true"/>
      <html:button id="zft-progress-cancel" data-l10n-id="zotero-fulltext-progress-cancel"/>
      <html:button id="zft-progress-close" data-l10n-id="zotero-fulltext-progress-close"/>
    </hbox>
  </vbox>
</window>
