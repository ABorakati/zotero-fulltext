[package]
name = "fulltext-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
# cdylib -> the .wasm shipped in the plugin; rlib -> native `cargo test` + benches.
crate-type = ["cdylib", "rlib"]

[features]
default = ["hand"]
# One HTML backend per feature so each can be size-measured on its own.
hand = []
tl = ["dep:tl"]
lolhtml = ["dep:lol_html"]
html5gum = ["dep:html5gum"]
scraper = ["dep:scraper"]
# Exposes fx_debug_panic so the JS side can observe a trap (spike only).
debug-panic = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
tl = { version = "0.7.8", optional = true }
lol_html = { version = "3.0.1", optional = true }
html5gum = { version = "0.8.4", optional = true }
scraper = { version = "0.27.0", optional = true, default-features = false }

[lints]
workspace = true
