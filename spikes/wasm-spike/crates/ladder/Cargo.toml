[package]
name = "ladder"
version = "0.1.0"
edition.workspace = true
publish = false

# Size ladder: ABI only -> +serde_json -> +url
[lib]
crate-type = ["cdylib"]

[features]
json = ["dep:serde", "dep:serde_json"]
url = ["dep:url"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
url = { version = "2.5", optional = true }
